name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  attach-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs --check
      - run: npm test
      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/ems-esp-heatpump-energy-card.js --clobber
